version: '3.4'

services:
  # Time-series database for k6 metrics
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  # Visualization tool for real-time dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    depends_on:
      - influxdb

  # Mock API using httpbin (HTTP request echo)
  api-mock:
    image: kennethreitz/httpbin
    ports:
      - "8000:80"
